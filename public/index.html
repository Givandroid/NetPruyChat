<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NetPruyChat — Aplikasi Chat Jaringan</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- ============ TAMPILAN 1: LOGIN / MASUK ROOM ============ -->
    <section id="login-screen" class="login-screen">
      <div class="login-glow" aria-hidden="true"></div>

      <form id="login-form" class="login-card" autocomplete="off">
        <div class="brand">
          <span class="brand-mark">N</span>
          <div>
            <h1 class="brand-name">NetPruyChat</h1>
            <p class="brand-tag">Chat real-time client-server</p>
          </div>
        </div>

        <div class="field">
          <label for="username-input">Username</label>
          <input
            id="username-input"
            type="text"
            placeholder="Contoh: budi"
            maxlength="20"
            autocomplete="username"
            required
          />
        </div>

        <!-- Email hanya wajib saat mendaftar; disembunyikan saat login biasa. -->
        <div class="field hidden" id="email-field">
          <label for="email-input">Email</label>
          <input
            id="email-input"
            type="email"
            placeholder="Contoh: budi@gmail.com"
            maxlength="60"
            autocomplete="email"
          />
        </div>

        <div class="field">
          <label for="password-input">Password</label>
          <input
            id="password-input"
            type="password"
            placeholder="Minimal 4 karakter"
            maxlength="64"
            autocomplete="current-password"
            required
          />
        </div>

        <div class="field">
          <label for="room-input">Nama room</label>
          <input
            id="room-input"
            type="text"
            placeholder="Contoh: kelas-jaringan"
            maxlength="30"
            required
          />
        </div>

        <button type="submit" id="login-btn" class="btn-primary btn-block">
          Masuk ke Room
        </button>
        <button type="button" id="register-btn" class="btn-ghost btn-block">
          Belum punya akun? Daftar
        </button>
        <p id="login-error" class="error-text" role="alert"></p>
      </form>

      <!-- Kartu verifikasi email: tampil setelah registrasi berhasil. -->
      <form id="verify-form" class="login-card hidden" autocomplete="off">
        <div class="brand">
          <span class="brand-mark">N</span>
          <div>
            <h1 class="brand-name">Verifikasi Email</h1>
            <p class="brand-tag" id="verify-info">
              Masukkan kode yang dikirim ke email Anda.
            </p>
          </div>
        </div>

        <div class="field">
          <label for="code-input">Kode verifikasi (6 digit)</label>
          <input
            id="code-input"
            type="text"
            inputmode="numeric"
            pattern="[0-9]*"
            placeholder="Contoh: 123456"
            maxlength="6"
            autocomplete="one-time-code"
            required
          />
        </div>

        <button type="submit" id="verify-btn" class="btn-primary btn-block">
          Verifikasi & Masuk
        </button>
        <button type="button" id="resend-btn" class="btn-ghost btn-block">
          Kirim ulang kode
        </button>
        <button type="button" id="verify-back-btn" class="btn-ghost btn-block">
          ← Kembali
        </button>
        <p id="verify-error" class="error-text" role="alert"></p>
      </form>
    </section>

    <!-- ============ TAMPILAN 2: RUANG CHAT ============ -->
    <section id="chat-screen" class="chat-screen hidden">
      <!-- Sidebar: brand, daftar anggota, profil user -->
      <aside class="sidebar">
        <div class="sidebar-brand">
          <span class="brand-mark sm">N</span>
          <span class="brand-name sm">NetPruyChat</span>
        </div>

        <div class="sidebar-body">
          <h3 class="section-title">Anggota Room</h3>
          <ul id="user-list" class="user-list"></ul>
        </div>

        <div class="sidebar-footer">
          <div class="me">
            <span id="me-avatar" class="avatar"></span>
            <div class="me-info">
              <span id="me-name" class="me-name"></span>
              <span class="me-role">Kamu</span>
            </div>
          </div>
          <button id="leave-btn" class="btn-leave" title="Keluar dari room" aria-label="Keluar dari room">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>
      </aside>

      <!-- Area utama: header + pesan + input -->
      <main class="chat-main">
        <header class="chat-header">
          <div class="chat-header-info">
            <svg class="icon hash-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="14" y1="3" x2="12" y2="21"/></svg>
            <h2 id="room-name" class="room-name"></h2>
            <span class="member-badge">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              <span id="user-count">0</span>
            </span>
          </div>
          <div id="connection-status" class="status">
            <span class="status-dot"></span>
            <span class="status-text">Menghubungkan…</span>
          </div>
        </header>

        <div id="messages" class="messages"></div>

        <div id="typing-indicator" class="typing-indicator"></div>

        <!-- Pratinjau file terpilih -->
        <div id="file-preview" class="file-preview hidden">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          <span id="file-preview-name" class="file-preview-name"></span>
          <button id="file-cancel" type="button" title="Batal" aria-label="Batalkan file">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>

        <!-- Form kirim pesan -->
        <form id="message-form" class="message-form">
          <label for="file-input" class="btn-attach" title="Lampirkan file" aria-label="Lampirkan file">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </label>
          <input
            id="file-input"
            type="file"
            hidden
            accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.zip"
          />

          <input
            id="message-input"
            type="text"
            placeholder="Tulis pesan…"
            autocomplete="off"
          />
          <button type="submit" class="btn-send" title="Kirim" aria-label="Kirim pesan">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </form>
      </main>
    </section>

    <!-- Socket.IO client disediakan otomatis oleh server di path ini -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/socket.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
